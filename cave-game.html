        const Vector = (() => {
            class Vector {
                constructor(x = 0, y = 0, z = 0) {
                    this.x = x;
                    this.y = y;
                    this.z = z;
                }
                subtract(v) {
                    var ve = new Vector(this.x, this.y, this.z);
                    ve.x -= v.x;
                    ve.y -= v.y;
                    ve.z -= v.z;
                    return ve;
                }
                add(v) {
                    var ve = new Vector(this.x, this.y, this.z);
                    ve.x += v.x;
                    ve.y += v.y;
                    ve.z += v.z;
                    return ve;
                }
                divide(n) {
                    var ve = new Vector(this.x, this.y, this.z);
                    ve.x /= n;
                    ve.y /= n;
                    ve.z /= n;
                    return ve;
                }

                mult(n) {
                    var ve = new Vector(this.x, this.y, this.z);
                    ve.x *= n;
                    ve.y *= n;
                    ve.z *= n;
                    return ve;
                }
                magnitude() {
                    return Math.sqrt(this.x * this.x + this.y * this.y + this.z * this.z);
                }
                magSq() {
                    return this.x * this.x + this.y * this.y + this.z * this.z;
                }
                dot(v) {
                    return this.x * v.x + this.y * v.y + this.z * v.z;
                }
                scale(n) {
                    var ve = new Vector(this.x, this.y, this.z);
                    ve.x *= n;
                    ve.y *= n;
                    ve.z *= n;
                    return ve;
                }
                normalize() {
                    var ve = new Vector(this.x, this.y, this.z);
                    if (ve.x === 0 && ve.y === 0 && ve.z === 0) return ve;
                    ve = ve.divide(ve.magnitude());
                    return ve;
                }
                rotateBy(ang) {
                    return new Vector(this.x * Math.cos(ang) - this.y * Math.sin(ang), this.x * Math.sin(ang) + this.y * Math.cos(ang));
                }
                rotate3d(anglex, angley){
                    var ve = new Vector(this.x,this.y,this.z);
                    var ro1 = new Vector(this.y,this.z).rotateBy(-anglex);
                    var ro2 = new Vector(this.x,ro1.y).rotateBy(-angley);
                    ve.y = ro1.x
                    ve.z = ro1.y;
                                
                    ve.x = ro2.x;
                    ve.z = ro2.y;
                    return ve;
                }
                reflect(n) {
                    var ve = new Vector(this.x, this.y);
                    ve = ve.subtract(n.scale(2 * ve.dot(n)))
                    return ve;
                }
                abs() {
                    var ve = new Vector(this.x, this.y, this.z);
                    ve.x = Math.abs(ve.x);
                    ve.y = Math.abs(ve.y);
                    ve.z = Math.abs(ve.z);
                    return ve;
                }
                max(n) {
                    var ve = new Vector(this.x, this.y, this.z);
                    ve.x = Math.max(ve.x, n);
                    ve.y = Math.max(ve.y, n);
                    ve.z = Math.max(ve.z, n);
                    return ve;
                }
            } 
            return Vector;

        const terrain = (() => {

            const cache = {};

            let blocksToFill = [];
            let hitBigCaveAir = false; // if we hit air that has already been marked as in a big cave, then we instantly know we are in a big cave and dont need to continue
            const floodFillMax = 500;

            const wallThreshold = 0.3; // the threshold for the perlin noise that will make some block solid
            const stoneThreshold = 0.2;
            const smoothStoneThreshold = 0.17;

            return {
                getBlock (x, y, floodFilling) {

                    // if we are in the floodfilling recursion and have reached over 100 connected air blocks, then we have detected that we are in a large cave
                    if (floodFilling && blocksToFill.length > floodFillMax) return false;

                    if (floodFilling && cache[y] && cache[y][x] && cache[y][x].bigCave) hitBigCaveAir = true;

                    // check the cache
                    if (cache[y] && cache[y][x] !== undefined) return cache[y][x];

                    // adding 1e5 to the coords because the origin is symetrical for some reason so we need to shift away
                    const val = noise(x * 0.02 + 1e5, y * 0.02 + 1e5) ** 2;
                    let block = {bigCave: false, solid: false}; 
                    if (val > wallThreshold) {block.type = "wall"; block.solid = true;}
                    else if (val > stoneThreshold) {block.type = "stone";}
                    else if (val > smoothStoneThreshold) {block.type = "smoothStone";}
                    else {block.type = "path";}

                    if (!cache[y]) cache[y] = {};
                    cache[y][x] = block

                    // if its an air block, then floodfill to detect small caves
                    if (!block.solid) {
                        if (!floodFilling) {
                            // reset on the first one
                            blocksToFill = [];
                            hitBigCaveAir = false;
                        } 

                        blocksToFill.push([x, y]);

                        if (!hitBigCaveAir) {
                            // visit all of the neighbors
                            terrain.getBlock(x + 1, y, true)
                            terrain.getBlock(x - 1, y, true)
                            terrain.getBlock(x, y + 1, true)
                            terrain.getBlock(x, y - 1, true)
                        }
                        
                        // either fill in air blocks with stone if a enclosed cave is detected, or fill with cave air blocks if a large cave is detected
                        // const blockTypeToFill = (blocksToFill.length <= floodFillMax && !hitBigCaveAir) ? "stone":"big cave air";
                        if (!floodFilling) {
                            for (let i of blocksToFill) {
                                if ((blocksToFill.length <= floodFillMax && !hitBigCaveAir)) {
                                    cache[i[1]][i[0]].type = "wall";
                                    cache[i[1]][i[0]].solid = true;
                                } else {
                                    cache[i[1]][i[0]].bigCave = true;
                                }
                            }
                        }
                    }

                    return block;
                },
            }
        })();

            const distSquared = (x1, y1, x2, y2) => (x1 - x2)**2 + (y1 - y2)**2;
            const dist = (x1, y1, x2, y2) => Math.sqrt(distSquared(x1, y1, x2, y2));

            // gets the minimum translation vector for a circ to rect collision, if the circ and rect are colliding
            function circToRect (circ, rect) {
                const closestPoint = {
                    x: constrain (circ.x, rect.x, rect.x + rect.width),
                    y: constrain (circ.y, rect.y, rect.y + rect.height),
                };

                if (distSquared(circ.x, circ.y, closestPoint.x, closestPoint.y) >= circ.radius**2) return false;

                // get the MTV
                const pointToCirc = new Vector(circ.x - closestPoint.x, circ.y - closestPoint.y);

                const mtv = pointToCirc.normalize().scale(circ.radius -  dist(circ.x, circ.y, closestPoint.x, closestPoint.y));
                return mtv;
            }

            const attack = (() => {

                function SAT (poly, circ) {
                            
                    let normals = [];
                    
                    let minD = [-1, Infinity];
                    
                    for (let i = 0; i < poly.length - 1; i ++) {
                        // closest vertex to circle center
                        const circPoly = poly[i].subtract(new Vector(circ.x, circ.y));
                        if (circPoly.magSq() < minD[1]) {
                            minD = [circPoly, circPoly.magSq()];
                        }
                        
                        // normals of the edges of the plygon
                        const vec = poly[i].subtract(poly[(i + 1) % (poly.length - 1)]);
                        normals.push (new Vector(vec.y, -vec.x));
                    }
                    
                    // circ to vertex axis
                    normals.push (minD[0]);
                    
                    let colliding = true;
                    let mtv = false;
                    let minOverlap = Infinity; // axis, overlap
                    
                    // I wrote this a while ago but I beleive this projects the corners of the rect and center of the circle to see if the shapes are colliding
                    for (let j = 0; j < normals.length ; j ++) {
                        
                        const axis = normals[j].normalize();
                        const circProj = new Vector(circ.x, circ.y).dot(axis);

                        let max = -Infinity;
                        let min = Infinity;
                        
                        for (let i = 0; i < poly.length - 1; i ++) {
                            const projection = poly[i].dot(axis);
                            if (max < projection) max = projection;
                            if (min > projection) min = projection;
                        }
                        
                        const [circMin, circMax] = [circProj - circ.radius, circProj + circ.radius];
                        
                        if (!(min < circMax && max > circMin)) return false;
                        
                        let overlapDistance = Math.min(max, circMax) - Math.max(min, circMin);

                        if (overlapDistance < minOverlap) {
                            minOverlap = overlapDistance;
                            mtv = axis;
                        }
                    }
                    
                    mtv = mtv.mult(minOverlap);
                    
                    const circCenter = createVector(circ.x, circ.y);
                    if (poly[poly.length - 1].subtract(circCenter).dot(mtv) < 0) mtv = mtv.mult(-1);
                    
                    return mtv;

                            poly[i] = rot(poly[i], v(), a);
                            poly[i] = poly[i].add(v(x, y));
                            sum = sum.add(poly[i]);
                        }
                        
                        sum = sum.divide(poly.length);
                        
                        poly.push(sum);
                        
                        return poly;
                    }

                    return {
                        "wooden sword": function (data) {

                                    ], x, y, a);

                    switch (this.shape) {

                            ellipse(this.x, this.y, this.diameter, this.diameter);
                            break;
                        default:
                            console.log("entity shape is not valid", this);
                    }
                }

                    this.display();
                    return this.dead;
                }

                checkIfDead () {
                    if (this.health <= 0) this.dead = true;
                }

                // will be used for subclass method overriding. I learned that this is bad practice after I had already written this and dont think that it is worth it to change it.
                handleAttack () {}
                handleMovement () {}
                handleInventory () {} // this is only relevant for player and not for enemies

                update () {

                    this.checkIfDead();
                    if (!player.inventoryOpen && (player.turnedOnHeadlampOnce || player.weapon === "flashlight")) this.handleMovement();
                    this.applyVelocity();
                    this.handleCollisions();
                    if (!player.inventoryOpen && (player.turnedOnHeadlampOnce || player.weapon === "flashlight")) this.handleAttack();
                    this.handleInventory();
                    this.collideWithChests();
                    
                    this.reload --;
                    this.immunityTime --;

                // collide the entity with the terrain
                handleCollisions () {

                    // loop through a 10x10 grid of blocks around the entity to collide with
                    // only need to collide with blocks that are close to the entity.
                    for (let i = this.tileY - 5; i < this.tileY + 5; i ++) {
                        for (let j = this.tileX - 5; j < this.tileX + 5; j ++) {

                            // only need to collide with solid blocks
                            if (terrain.getBlock(j, i).solid) {
                                const mtv = circToRect(this, {x: j * TILE_SIZE, y: i * TILE_SIZE, width: TILE_SIZE, height: TILE_SIZE});

                                if (mtv) {
                                    this.position = this.position.add(mtv);
                                    this.velocity = this.velocity.mult(0.5);
                                };
                            }
                        }
                    }
                }

                // use the attack function defined earlier to use a weapon
                attack () {
                    if (this.reload > 0) return;
                    if (!this.weaponData.usable) return;
                    this.reload = this.weaponData.reload;
                    attack({type: this.weapon, user: this});
                }

                // display the weapon that the entity is holding, animating it based on the reload time
                displayWeapon () {

                    // how many frames the weapon will swing out for. the rest of the frames in the weapons reload are reserved for the weapon traveling back to its starting position
                    const attackFrames = 8;

                    if (!images[this.weapon]) return;

                    // I have implemented two different types of attack animations, but only the flashlight uses the second one (:sob:)
                    const animType = this.weaponData.animation;

                    if (this.reload > this.weaponData.reload) this.reload = this.weaponData.reload - attackFrames - 1;
                    const framesSinceAttack = this.weaponData.reload - this.reload;

                    push ();

                    // lerp between values of different transformations and rotations to manuver the weapon in a way that it looks like it is being swung or thrusted
                    if (animType === "jab") {

                        translate (this.x, this.y);
                        rotate (this.angle);

                        const progress = (framesSinceAttack <= attackFrames) ? framesSinceAttack/attackFrames : 1 - (Math.min(framesSinceAttack, this.weaponData.reload) - attackFrames)/(this.weaponData.reload - attackFrames)
                        let startX = this.radius * 0.9;
                        let startY = this.radius * 1.1;
                        let endX = this.radius * 2.3;
                        let endY = this.radius * 0.5;

                        translate (lerp(startX, endX, progress), lerp(startY, endY, progress));
                        
                        rotate (PI/4 + PI)

                    } else if (animType === "swing") {

                        translate (this.x, this.y);

                        const progress = (framesSinceAttack <= attackFrames) ? framesSinceAttack/attackFrames : 1 - (Math.min(framesSinceAttack, this.weaponData.reload) - attackFrames)/(this.weaponData.reload - attackFrames)
                        let startA = this.angle;
                        let endA = this.angle - PI/1.5;

                        rotate (lerp(startA, endA, progress));

                        translate (this.radius * 0.9, lerp(this.radius * 1.1, 0, progress));

                        startA = PI/4 + PI;
                        endA = PI/4;

                        rotate (lerp(startA, endA, progress));

                    } else {
                        translate (this.x, this.y);
                        rotate (this.angle);

                        translate (this.radius * 0.9, this.radius * 1.1);
                        rotate (PI/4 + PI)
                    }

                    const imgS = this.radius * 1.5;
                    image (images[this.weapon], 0, -imgS, imgS, imgS);

                    pop();
                }
            }

            class Player extends Entity {
                constructor (config) {
                    super(config);
                    
                    this.items = Array(30).fill("");

                    // set the players starting inventory 
                    this.items[0] = "pickaxe";
                    this.items[1] = "flashlight";
                    this.holding = 0;

                    this.turnedOnHeadlampOnce = false;

                    this.inventoryOpen = false;
                    this.headlampOn = false;
                    this.chest = false;

                    this.bestSword = 0;
                    this.bestArmor = 0;

                    this.numTimesOpenedChests = 0;
                }

                get level () {
                    return (this.bestArmor + this.bestSword)/2
                }

                get weapon () {
                    return this.items[this.holding];
                }

                // find if there is a chest that is close enough to the player to be opened
                get openableChest () {
                    // find the closest chest
                    let minChestDist = Infinity;
                    let chest;
                    for (const i of chests.chests) {
                        let distance = distSquared(this.x, this.y, i.x, i.y);
                        if (distance < minChestDist) {
                            minChestDist = distance;
                            chest = i;
                        }
                    }

                    // check to see if we are close enough to open the chest
                    if (minChestDist < (this.diameter * 1.5) ** 2) return chest;
                    return false;
                }

                // funciton to reset the player to play again
                reset () {

                    this.position = new Vector (Math.random() * 1000 + 1000, Math.random() * 2000 + 2000);
                    this.items = Array(30).fill("");

                    // set the players starting inventory 
                    this.items[0] = "pickaxe";
                    this.items[1] = "flashlight";
                    this.holding = 0;

                    this.turnedOnHeadlampOnce = false;

                    this.inventoryOpen = false;
                    this.headlampOn = false;
                    this.chest = false;

                    this.bestSword = 0;
                    this.bestArmor = 0;

                    this.numTimesOpenedChests = 0;

                    this.health = 100;
                    this.maxHealth = this.health;
                    this.originalMaxHealth = this.maxHealth;
                    this.dead = false;

                    this._weapon = "wooden sword";
                    this.reload = 0;

                    this.immunityTime = -1;

                    playerPoints = 0;

                    enemies.enemies = [];
                }

                handleMovement () {

                    // addVelocity is the vector that will later be added to the players velocity
                    let addVelocity = new Vector(0, 0, 0);

                    if (keys.w) addVelocity.y -= 1;
                    if (keys.s) addVelocity.y += 1;
                    if (keys.a) addVelocity.x -= 1;
                    if (keys.d) addVelocity.x += 1;

                    // normalize the velocity so that going on diagonals does not make you faster
                    this.velocity = this.velocity.add(addVelocity.normalize().scale(this.movementPower));

                    this.angle = Math.atan2(mouseY - 300, mouseX - 300);

                    // collisions with enemies
                    for (const i of enemies.enemies) {
                        this.colWithEntity(i);
                    }
                }

                handleInventory () {

                    // open/close the player inventory
                    if (keys.e) {
                        keys.e = false; // only trigger once per keypress
                        this.inventoryOpen = !this.inventoryOpen;

                        // open chests
                        if (this.inventoryOpen) {
                            this.chest = this.openableChest;
                            this.numTimesOpenedChests ++;
                        } else {
                            this.chest = false; // close chest
                        }
                    }

                    // turn on/off the players headlamp
                    if (keys.f) {
                        keys.f = false; // only trigger once per keypress
                        this.headlampOn = !this.headlampOn;
                        if (this.headlampOn) this.turnedOnHeadlampOnce = true;
                    }

                    if (!this.inventoryOpen) this.switchSelected();
                }

                handleAttack () {

                    // handle use of item and update the players level according to level of the players items

                    if (click && this.weaponData.usable) {

                        this.attack();
                        if (this.bestSword < this.weaponData.level) this.bestSword = this.weaponData.level;

                    } else if (click && this.weaponData.consumable) {
                        if (this.weaponData.consumable === "food") {

                            this.health += this.weaponData.healing; // heal the player
                            this.health = Math.min(this.health, this.maxHealth); // constrain health
                            this.items[this.holding] = ""; // delete the food so it cannot be used twice

                        } else if (this.weaponData.consumable === "armor" && this.bestArmor < this.weaponData.level) {

                            this.bestArmor = this.weaponData.level; // set new best armor level
                            this.maxHealth = this.originalMaxHealth + this.weaponData.armor; // increase player max health
                            this.health += this.weaponData.armor; // heal the player
                            this.health = Math.min(this.health, this.maxHealth); // constrain health
                            this.items[this.holding] = ""; // delete armor

                        }
                    }
                }

                display () {
                    this.displayWeapon();

                    push();

                    translate (this.x, this.y);
                    rotate(this.angle - PI/2);

                    image (player.headlampOn ? images.player:images.playerNoHeadlamp, -this.radius, -this.radius, this.diameter, this.diameter);

                    pop();
                }

                // switch which hotbar slot the player has selected
                switchSelected () {
                    for (let i = 0; i < 5; i ++) {
                        if (keys[i + 1]) {
                            keys[i + 1] = false; // only trigger once per keypress
                            this.holding = i;
                        }
                    }
                }
            }

            class Enemy extends Entity {
                constructor (config) {
                    super (config);
                    this.type = config.type;
                }

                checkIfDead () {
                    let killed = false;
                    if (this.health <= 0) {this.dead = true; killed = true;}
                    if (distSquared(this.x, this.y, player.x, player.y) > 800 ** 2) this.dead = true;

                    const dropType = enemyTypes[this.type].dropType;


                    if (killed && Math.random() < 0.75) { // only drop loot 75% of the time

                        let items = [];
                        if (Math.random() < 0.4) items.push(`${dropType} sword`);
                        if (Math.random() < 0.2 && player.bestSword > 0) items.push(`${dropType} armor`);
                        if (Math.random() < 0.6) items.push(foodLevels[dropType]);

                        chests.add({x: this.x, y: this.y, items});
                    }

                    // display feedback for the kill and reward the player with points even if the enemy does not drop any loot
                    if (killed) {
                        screenFX ("kill", `Killed ${this.type}: +${dropLevels[dropType]} ${dropLevels[dropType] > 1 ? "rubies":"ruby"}`);
                        playerPoints += dropLevels[dropType];
                    }
                }

                // move the enemy towards the player
                handleMovement () {

                    this.velocity = this.velocity.add(player.position.subtract(this.position).normalize().scale(this.movementPower));

                    this.angle = Math.atan2(player.y - this.y, player.x - this.x);

                    // push the enemies out of eachother so they do not overlap
                    for (const i of enemies.enemies) {
                        if (i === this) continue;
                        this.colWithEntity (i);
                    }

                    this.colWithEntity (player);
                }

                // attack when close to the player
                handleAttack () {
                    if (distSquared(this.x, this.y, player.x, player.y) < (TILE_SIZE * 3.8) ** 2 || Math.random() < 1/60/10) this.attack();
                }

                display () {
                    if (!images[this.type]) return;

                    this.displayWeapon();
                    push();

                    translate (this.x, this.y);
                    rotate(this.angle - PI/2);

                    image (images[this.type], -this.radius, -this.radius, this.diameter, this.diameter);

                    pop();
                }
            }

            class Chest extends Entity {
                constructor (config) {
                    super (config);

                    this.shape = "circle";
                    this.health = 1;
                    this.items = copyObj(config.items);
                }

                display () {
                    image (images.chest, this.x - TILE_SIZE * 1.5, this.y - TILE_SIZE * 1.5, TILE_SIZE * 3, TILE_SIZE * 3);
                }

                run () {
                    this.display();
                    return this.items.length < 1 || this.health <= 0 || (() => {
                        let dead = true;
                        for (const i of this.items) if (i) dead = false;
                        if (player.chest) dead = false;
                        return dead;
                    })();
                }
            }

            const enemies = {
                enemies: [],

                run () {
                    for (var i = this.enemies.length - 1; i >= 0; i--) {
                        if (this.enemies[i].run()) this.enemies.splice(i, 1);
                    }
                },

                add (config) {
                    this.enemies.push (new Enemy(config));
                },
            }

            const chests = {
                chests: [],

                run () {
                    for (var i = this.chests.length - 1; i >= 0; i--) {
                        if (this.chests[i].run()) this.chests.splice (i, 1);
                    }
                },

                add (config) {
                    this.chests.push(new Chest(config));
                }
            };

            const player = new Player({x: 0, y: 0, shape: "circle"})

            // effects such as red tint on damage and text messages for kills
            const screenFX = (() => {
                let damageOpacity = 0;
                let killOpacity = 0;
                let displayText = ""

                return function (type, data) {
                    if (type === "damage") {
                        damageOpacity = 100;
                    } else if (type === "kill") {
                        killOpacity = 255;
                        displayText = data;
                    }

                    if (damageOpacity > 0) {
                        noStroke();
                        fill(200, 20, 20, damageOpacity);
                        rect(0, 0, width, height);

                        damageOpacity -= 20;
                    }
                    
                    if (killOpacity > 0) {
                        fill(245, killOpacity);
                        noStroke();
                        textSize(40);
                        textFont('VT323');
                        textAlign(CENTER, CENTER);
                        text(displayText, 300, 40);

                        killOpacity --;
                    } else if (!player.headlampOn && player.items[player.holding] !== "flashlight"){
                        // message to turn on headlamp
                        fill(245);
                        noStroke();
                        textSize(40);
                        textFont('VT323');
                        textAlign(CENTER, CENTER); 
                        if (!player.inventoryOpen) text("Press [F] to turn on your headlamp", 300, 40);
                    }
                }
            })();

            return {player, enemies, chests, screenFX};
        })();

        const scenes = (() => {

            const startScene = "home";

            // returns an object with a function for each scene and a function that runs the current scene. This function will also transition to a new scene at the end of the frame if necesary.
            // the reason that the scene functions are the way they are (an iife returning a function) is so that each scene can have a local scope to store data that is only relevant to the scene.

            return {
                current: "loading",

                run () {
                    this[this.current](); // run the current scene

                    click = false;

                    if (scenes.nextTransition) { // transition
                        scenes.nextTransition[1] = scenes.nextTransition[1](); // get the image of the canvas at the time of the start of the transition
                        scenes.transition(...scenes.nextTransition)
                    };
                },

                nextTransition: false,
                transitionTo: false, // so buttons can display during the transition
            
                transition: (() => {
            
                    let fromImg;
                    let to = "";
                    let amt = 0;
                    let speed = 1;
                    let data = false;
                    let sentData = false;
                    let transitionType = "slide";
            
                    return function (_to, img, _speed, _transitionType = "slide", _data) {
            
                        amt += (delataTime)/1000/speed;
                        
                        if (_to) {

                            // so we dont try to transition twice
                            scenes.nextTransition = false;
                            
                            // reset data for the transition
                            to = _to;
                            scenes.transitionTo = to;
                            transitionType = _transitionType;
                            fromImg = img;
                            scenes.current = "transition";
                            amt = 0;
                            data = _data || false;
                            sentData = false;

                            if (_speed && _speed > 0) speed = _speed;
                        }
            
                        if (amt < 0.5) {
                            // display image from last scene
                            image(fromImg, 0, 0, 600, 600);
                        } else if (amt < 1){
                            // run the next scene
                            if (sentData) {
                                scenes[to]();
                            } else {
                                scenes[to](data);
                                sentData = true;
                            }
                            
                        } else {
                            // switch to the next scene
                            scenes.current = to;
                            scenes.transitionTo = false;
                        }
                
                        if (transitionType === "shrink") {
                            if (amt < 0.5) amt = 0.5; // only second half of transition
                            const a = (amt - 0.5) * 2;

                            noStroke();
                            fill(240);
                            rect (a * 27, a * 267, lerp(606, 306, a), lerp(606, 306, a));
                            image(fromImg, a * 30, a * 270, lerp(600, 300, a), lerp(600, 300, a))
                        } else {
                            // the gray square that sweeps over the screen
                            fill(20);
                            noStroke();
                            rect(-600 + 1200 * anim1(amt), 0, 600, 600);
                        }
                        
                    }
                })(),
            
                loading: (() => {
            
                    let curInd = 0;
                    let keys = Object.keys(images);
            
                    return function () {

                        background (50);
            
                        // replace the functions in the image objects with what they return;
                        if (images[keys[curInd]]) images[keys[curInd]] = images[keys[curInd]]();
                        
                        // generate text with . for progress
                        let txt = (() => {
            
                            if (curInd >= keys.length - 1) return "LOADED!";
            
                            let res = ["LOADING"];
                            for (let j = 0; j <= curInd / 2; j ++) {
                                res[res.length - 1] += "."
                                if (textWidth(res[res.length - 1]) > 550) {
                                    res[res.length - 1] += "\n";
                                    res.push("");
                                }
                            }

                            const innitial = "";
                            const fullRes = res.reduce(
                                (accumulator, currentValue) => accumulator + currentValue,
                                innitial,
                            );

                            return fullRes;
                        })();
                        
                        // Display the loading progress
                        textSize(100);
                        textFont('Anton');
                        fill(220);
                        textAlign(CENTER, BASELINE);
            
                        text (txt, 300, 270);
            
                        curInd ++;

                        if (curInd >= keys.length) {
                            scenes.nextTransition = [startScene, get, 0.3];
                        }
                    }
                })(),

                play: (() => {

                    function displayTerrain () {                        
                        noStroke();

                        for (let i = player.tileY - TILES_IN_SCREEN; i < player.tileY + TILES_IN_SCREEN; i ++) {
                            for (let j = player.tileX - TILES_IN_SCREEN; j < player.tileX + TILES_IN_SCREEN; j ++) {

                                // this determines which tile of the pixel art will be displayed
                                // the tileating pixel art tiles are bigger than the tiles themselves, so the pixel art has to be broken up
                                let x = j < 0 ? (3 - (-j % 4)) : j % 4;
                                let y = i < 0 ? (3 - (-i % 4)) : i % 4;

                                const blockType = terrain.getBlock(j, i).type;

                                if (blockType === "wall") {
                                    image(images.wall[x + y * 4], j * TILE_SIZE, i * TILE_SIZE, TILE_SIZE, TILE_SIZE)
                                } else if (blockType === "stone") {
                                    image(images.stone[x + y * 4], j * TILE_SIZE, i * TILE_SIZE, TILE_SIZE, TILE_SIZE)
                                } else if (blockType === "smoothStone") {
                                    image(images.smoothStone[x + y * 4], j * TILE_SIZE, i * TILE_SIZE, TILE_SIZE, TILE_SIZE)
                                } else {
                                    image(images.path[x + y * 4], j * TILE_SIZE, i * TILE_SIZE, TILE_SIZE, TILE_SIZE)
                                }                          
                            }
                        }
                    }

                    function spawnEnemies () {

                        // max enemies is determined by the players level
                        if (enemies.enemies.length >= Math.max(1, player.level * 0.75)) return;

                        // aim to spawn an enemy every 3 second
                        if (Math.random() > 1/(60 * 3)) return;

                        // calculate the level of the enemy to spawn
                        let enemyLevel = Math.min(Math.round(random(player.level - 0.5, player.level + 0.5)), 6);

                        // the angle from the player to spawn the enemy at. the enemies spawn in a ring around the player so the player does not see them spawning
                        const angle = Math.random() * Math.PI * 67;

                        let data = copyObj(enemyTypes[enemyLevels[enemyLevel]]);

                        // calculate x and y coords of the enemy's spawn point
                        data.x = player.x + cos(angle) * TILES_IN_SCREEN * TILE_SIZE * 0.7;
                        data.y = player.y + sin(angle) * TILES_IN_SCREEN * TILE_SIZE * 0.7;
                        data.shape = "circle";

                        enemies.add(data);

                        // dont spawn enemies inside of a wall 
                        const enemy = enemies.enemies[enemies.enemies.length - 1];
                        if (terrain.getBlock(enemy.tileX, enemy.tileY).solid) enemy.dead = true;
                    }

                    function displayLight () {

                        // determine which light mask should be overlaid
                        if (player.items[player.holding] === "flashlight") {
                            image(images.brightightMask, 0, 0, width, height);
                        } else if (player.headlampOn) {
                            image(images.dimLightMask, 0, 0, width, height);
                        } else {
                            image(images.noLightMask, 0, 0, width, height);
                        }
                    }

                    function rearangeInventories (mx, my, invX, invY, chest) {
                        // find which box the player is hovering over
                        let x = Math.floor((mx - (mx % 51.2))/51.2);
                        let y = Math.floor((my - (my % 51.2))/51.2);

                        // highlight the selected square
                        noFill();
                        stroke(230);
                        strokeWeight(6);
                        rect(invX + 3 + 50 * x, invY + 3 + 50 * y, 50, 50);

                        // swap the items to the hotbar
                        for (let i = 0; i < 5; i ++) {
                            if (keys[i + 1]) {
                                keys[i + 1] = false; // only trigger once per keypress
                                let originalHotbar = player.items[i];

                                if (!chest) {
                                    player.items[i] = player.items[y * 5 + x + 5];
                                    player.items[y * 5 + x + 5] = originalHotbar;
                                } else {
                                    player.items[i] = chest.items[y * 5 + x];
                                    chest.items[y * 5 + x] = originalHotbar;
                                }
                                
                            }
                        }
                    }

                    function displayPlayerInventory () {

                        // start by displaying the hotbar
                        image (images.hotbar, 175 - 3, 522, 256, 56);

                        noStroke();
                        fill (255, 200);
                        textFont('VT323');
                        textAlign(CENTER, CENTER);

                        textSize(15);

                        // display the items in the player's hotbar
                        for (let i = 0; i < 5; i ++) {

                            text (i + 1, i * 50 + 200, 587);

                            const item = player.items[i];
                            if (item) image(images[item], 184 + i * 50, 534, 35, 35);
                        }

                        noFill();
                        stroke(230);
                        strokeWeight(4);
                        rect(175 + 50 * player.holding, 525, 50, 50);

                        // now, if the inventory is open, display the inventory
                        if (!player.inventoryOpen) return;

                        // tell the player how to use the inventory
                        textSize(40);
                        noStroke();
                        fill(255, 200);
                        text("Press numbers 1-5 to swap items\nin your inventory", 300, 60);

                        let chest = player.chest;
                        let [invX, invY] = [172, 172];
                        let [chestX, chestY] = [311, 172];

                        if (chest) invX = 33;

                        image(images.inventory, invX, invY, 256, 256);
                        if (chest) image(images.inventory, chestX, chestY, 256, 256); // display chest

                        // display the items in the player's inventory and chest
                        for (let i = 0; i < 5; i ++) {
                            for (let j = 0; j < 5; j ++) {
                                let item = player.items[i * 5 + j + 5];
                                if (item) image(images[item], invX + 12 + j * 50, invY + 12 + i * 50, 35, 35);

                                if (chest) {
                                    item = chest.items[i * 5 + j];
                                    if (item && images[item]) image(images[item], chestX + 12 + j * 50, chestY + 12 + i * 50, 35, 35);
                                }
                            }
                        }

                        // allow the user to arrange their inventory

                        // make sure the mouse is actually over the inventory
                        let [mx, my] = [mouseX - invX, mouseY - invY]; // relative mouse coords
                        if (mx > 0 && my > 0 && mx < 256 && my < 256) {
                            rearangeInventories(mx, my, invX, invY, false);
                        }

                        if (!chest) return; // dont need to swap items in a chest if a chest is not open
                        [mx, my] = [mouseX - chestX, mouseY - chestY];
                        if (mx > 0 && my > 0 && mx < 256 && my < 256) {
                            rearangeInventories(mx, my, chestX, chestY, chest);
                        }
                    }

                    function displayPlayerHearts () {

                        function displayHeart (img, i) {
                            image(img, i * 2.3 + 165, 490, 20, 20);
                        }

                        function displayArmor (img, i) {
                            image(img, ((i - 10) % 100 + 10) * 2.3 + 165, 467 - 23 * Math.floor((i - 10)/100), 20, 20);
                        }

                        // display the hearts
                        for (var i = 10; i <= player.originalMaxHealth; i += 10) {

                            if (i > player.health && i - 10 < player.health) {
                                displayHeart(images.halfHeart, i)
                            } else if (i <= player.health) {
                                displayHeart(images.heart, i)
                            }else {
                                displayHeart(images.emptyHeart, i)
                            }
                        }

                        // display the armor
                        const amountArmor = player.maxHealth - player.originalMaxHealth;
                        const armorHealth = player.health - 100;

                        for (var i = 10; i <= amountArmor; i += 10) {
                            if (i > armorHealth && i - 10 < armorHealth) {
                                displayArmor(images.halfArmor, i)
                            } else if (i <= armorHealth) {
                                displayArmor(images.armor, i)
                            }else {
                                displayArmor(images.emptyArmor, i)
                            }
                        }
                    }

                    // make sure that different screen effects dont interfere
                    function handleScreenFX () {
                        if (!player.inventoryOpen && (!player.openableChest || player.numTimesOpenedChests >= 2)) {
                            screenFX();
                        }

                        if (!player.inventoryOpen && player.openableChest && player.numTimesOpenedChests < 2) {
                            fill(245);
                            noStroke();
                            textSize(40);
                            textFont('VT323');
                            textAlign(CENTER, CENTER);
                            text("[E] to open chest", 300, 40);
                        }
                    }

                    return function () {

                        let playerDead = false;

                        push();
                        // put the player in the center of the screen
                        translate (Math.round(300 - player.x), Math.round(300 - player.y));

                        background (230);
                        displayTerrain ();
                        spawnEnemies();

                        chests.run();
                        if (player.run()) playerDead = true;
                        enemies.run();

                        pop();

                        displayLight();
                        displayPlayerInventory();
                        displayPlayerHearts();
                        handleScreenFX();

                        if (playerDead) scenes.nextTransition = ["gameOver", get, 1, "shrink", {img: get()}];
                    }
                })(),

                gameOver: (() => {

                    let img;

                    return function (_data) {
                        if (_data) img = _data.img;

                        background(20);

                        // outline for the image
                        noStroke();
                        fill(240);
                        rect(27, 267, 306, 306);

                        // display the image
                        if (img) image(img, 30, 270, 300, 300);

                        // messages
                        textFont('VT323');
                        textAlign(CENTER, CENTER);

                        fill (220, 20, 20);
                        textSize(120);
                        text("You Died", 300 + Math.random() * 4 - 2, 60 + Math.random() * 4 - 2);

                        fill (240);
                        textSize(40);

                        if (playerPoints > 0) {
                            text(`at least you survived long\nenough to find ${playerPoints > 1 ? playerPoints:"a"} ${playerPoints === 1 ? "ruby":"rubies"}`, 300, 180);
                        } else {
                            text(`and you didnt even find a\nsingle ruby`, 300, 180);
                        }
                        
                        buttons.run();
                    }
                })(),

                selectMode: (() => {
                    return function () {
                        image(images.menuImg, 0, 0);
                        textFont('VT323');
                        textAlign(CENTER, CENTER);

                        fill (220);
                        textSize(120);
                        text("Select Mode:", 300, 80);

                        buttons.run();
                    }
                })(),

                home: (() => {

                    return function () {
                        image(images.menuImg, 0, 0, width, height);

                        // title
                        textFont('VT323');
                        textAlign(CENTER, CENTER);

                        fill (20);
                        stroke (240);
                        strokeWeight (4);
                        textSize(120);
                        text("Subterranean", 300, 50);
                        text("Survival", 300, 140);

                        noStroke ();
                        fill(86, 56, 10);
                        rect(50, 490, 500, 80);

                        stroke(240)
                        fill(20);

                        textSize (90);
                        text("CLICK TO PLAY", 300, 530);

                        image(images.menuMiner, 140, 256, 200, 200);

                        if (click) {
                            player.reset();
                            scenes.nextTransition = ["selectMode", get, 0.8];
                        }
                    }
                })(),
            };
        })();

        const drawFunction = (() => {

            // for delta time calculations
            let then = performance.now();

            // not using function x () {} notation because iife. iife is simply for organization here
            setup = function () {
            
                // this clears all animation frames preventing them from stacking up if the webpage is reloaded
                // sourced from stack overflow somewhere
                let id = window.requestAnimationFrame(function(){});
                while (id--){
                    window.cancelAnimationFrame(id);
                }
                
                createCanvas (600, 600);
                frameRate(60); // max framerate yay
            };
            
            draw = function () {

                let now = performance.now();
                delataTime = now - then;
                then = now;

                scenes.run();

                if (easyMode) {
                    fill(245);
                    noStroke();
                    textSize(40);
                    textFont('VT323');
                    textAlign(LEFT, TOP);
                    text("Easy Mode", 0, 560);
                }
            };
        })()    
        
        const userInput = (() => {
            // not using function x () {} notation because iife. iife is simply for organization here

            mousePressed = function() {
                click = true;
            }

            keyPressed = function () {
                keys[key] = keys[key.toString()] = true;
            }
            
            keyReleased = function () {
                keys[key] = keys[key.toString()] = false;
            }
        })();
        
        })();
    </script>
</html>
